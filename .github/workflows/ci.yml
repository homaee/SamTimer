name: CI

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The exploit payload is plain C, but it is cross-compiled for arm64
      # by the same Gradle build, so the NDK is required alongside the SDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships an SDK at /usr/local/lib/android/sdk
      # (ANDROID_SDK_ROOT); point ANDROID_HOME at the same path -- AGP
      # refuses to configure when the two disagree.
      - name: Configure SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform, build-tools and NDK
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (payload + app)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamTimer-debug
          path: app/build/outputs/apk/debug/*.apk
